<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#032b43" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  
  <!-- Subtle neural grid lines -->
  <circle cx="200" cy="180" r="140" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="180" r="110" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1.5" />
  
  <!-- Ambient glow circle -->
  <circle cx="200" cy="160" r="80" fill="url(#circleGrad)" filter="url(#glow)" />

  <!-- Avatar stylized silhouette / AI Engineer graphic -->
  <!-- Head & Hair -->
  <ellipse cx="200" cy="150" rx="46" ry="52" fill="#1e293b" stroke="url(#neonGrad)" stroke-width="2.5" />
  
  <!-- Modern glasses / tech visor -->
  <rect x="165" y="142" width="70" height="14" rx="7" fill="rgba(6, 182, 212, 0.25)" stroke="#38bdf8" stroke-width="2" />
  <circle cx="178" cy="149" r="2.5" fill="#38bdf8" />
  <circle cx="222" cy="149" r="2.5" fill="#38bdf8" />

  <!-- Torso & shoulders with neural badge -->
  <path d="M120 310 C120 240, 155 220, 200 220 C245 220, 280 240, 280 310 Z" fill="#131c31" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />
  
  <!-- Neural node badge on chest -->
  <circle cx="200" cy="250" r="7" fill="#10b981" filter="url(#glow)" />
  <path d="M200 257 L200 280" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3" />
  <path d="M185 265 L200 250 L215 265" stroke="rgba(6, 182, 212, 0.6)" stroke-width="1.5" fill="none" />

  <!-- Floating AI Nodes -->
  <circle cx="100" cy="130" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="305" cy="140" r="4" fill="#10b981" filter="url(#glow)" />
  <circle cx="85" cy="220" r="4" fill="#818cf8" />
  <circle cx="315" cy="230" r="5" fill="#06b6d4" filter="url(#glow)" />
  <line x1="100" y1="130" x2="160" y2="150" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
  <line x1="305" y1="140" x2="245" y2="150" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />

  <!-- Initials Badge -->
  <rect x="145" y="325" width="110" height="28" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
  <text x="200" y="344" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">SAFA • AI</text>
</svg>